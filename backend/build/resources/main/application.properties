# =========================
# Server settings
# =========================
server.port=8080

# =========================
# MySQL datasource.
# Local default uses root user. For deployment, set MYSQL_URL, MYSQL_USER and MYSQL_PASSWORD.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/employee_ms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# "update" lets beginners run the backend and have schema generated automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Hibernate can detect MySQL automatically, but this keeps the beginner setup explicit.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# Session (cookie-based)
# =========================
# Uses the default servlet HttpSession. No extra session tables are required.
server.servlet.session.timeout=30m

# =========================
# File upload (employee photo)
# =========================
# Images will be stored in this folder on the server.
app.upload.dir=uploads

# =========================
# CORS (frontend running on different origin)
# =========================
app.cors.allowed-origins=http://localhost:5500,http://localhost:5173

# =========================
# Seed admin default credentials (documented in README)
# =========================
app.admin.username=admin
app.admin.password=admin123
