# Development profile using in-memory H2 to allow quick local runs without MySQL
spring.datasource.url=jdbc:h2:mem:employee_ms;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Allow the dev frontend origin
app.cors.allowed-origins=http://localhost:5500
