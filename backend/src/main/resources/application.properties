# =========================
# Server settings
# =========================
server.port=8080

# =========================
# H2 in-memory数据库 for development
# For production, switch to MySQL by setting spring.profiles.active=prod
spring.datasource.url=jdbc:h2:mem:employee_ms;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# "update" lets beginners run the backend and have schema generated automatically.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# =========================
# Session (cookie-based)
# =========================
# Uses the default servlet HttpSession. No extra session tables are required.
server.servlet.session.timeout=30m

# =========================
# File upload (employee photo)
# =========================
# Images will be stored in this folder on the server.
app.upload.dir=uploads

# =========================
# CORS (frontend running on different origin)
# =========================
app.cors.allowed-origins=http://localhost:5500,http://localhost:5173

# =========================
# Email/SMTP Configuration (for password reset)
# =========================
# For production, configure real SMTP credentials
app.smtp.host=
app.smtp.port=587
app.smtp.username=
app.smtp.password=
app.smtp.from=noreply@employeems.com

# =========================
# Frontend URL (for password reset links)
# =========================
app.frontend.url=http://localhost:5500

# =========================
# Seed admin default credentials (documented in README)
# For production, set these via environment variables
# =========================
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
