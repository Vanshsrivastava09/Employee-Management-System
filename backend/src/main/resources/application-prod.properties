# Production profile for MySQL
# Activate with: spring.profiles.active=prod

# =========================
# MySQL datasource for production
# =========================
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA settings
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# Security settings
# =========================
# Override admin credentials from environment
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL:admin@company.com}

# =========================
# Email/SMTP Configuration (for password reset)
# =========================
app.smtp.host=${SMTP_HOST}
app.smtp.port=${SMTP_PORT:587}
app.smtp.username=${SMTP_USERNAME}
app.smtp.password=${SMTP_PASSWORD}
app.smtp.from=${SMTP_FROM:noreply@company.com}

# =========================
# Frontend URL (for password reset links)
# =========================
app.frontend.url=${FRONTEND_URL}

# =========================
# CORS settings for production
# =========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# =========================
# Session timeout
# =========================
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
