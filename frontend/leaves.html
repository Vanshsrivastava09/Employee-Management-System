<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMS HR Leaves</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mini"><div class="mark"></div><div><div class="brand-text">EMS HR</div><div class="brand-sub">Admin Panel</div></div></div>
      <nav class="nav">
        <a href="dashboard.html"><span class="nav-icon">D</span><span>Dashboard</span></a>
        <a href="employees.html"><span class="nav-icon">E</span><span>Employees</span></a>
        <a href="departments.html"><span class="nav-icon">P</span><span>Departments</span></a>
        <a href="salaries.html"><span class="nav-icon">S</span><span>Salaries</span></a>
        <a href="notices.html"><span class="nav-icon">N</span><span>Issue Notices</span></a>
        <a class="active" href="leaves.html"><span class="nav-icon">L</span><span>Leaves</span></a>
        <a href="attendances.html"><span class="nav-icon">A</span><span>Attendances</span></a>
        <a href="requests.html"><span class="nav-icon">R</span><span>Requests</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="profile-section"><div class="profile-avatar"></div><div><div class="profile-name">HR Admin</div><div class="profile-sub">Session active</div></div></div>
        <button id="logoutBtn" class="btn btn--ghost" type="button">Logout</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button id="mobileMenuBtn" class="icon-btn mobile-menu" type="button">M</button>
          <div class="header-title"><h2>Leaves</h2><p>Approve or reject leave requests and view leave history.</p></div>
        </div>
        <button id="createLeaveBtn" class="btn btn--primary" type="button">Create Leave</button>
      </div>

      <section class="table-wrap">
        <div class="table-tools"><div class="left"><select id="leaveEmployeeFilter"><option value="">All employees</option></select></div><div class="right"><span class="pill">Leave requests</span></div></div>
        <div class="table-scroll"><table><thead><tr><th>Employee</th><th>Period</th><th>Reason</th><th>Status</th><th style="text-align:right;">Actions</th></tr></thead><tbody id="leavesTableBody"><tr><td colspan="5">Loading...</td></tr></tbody></table></div>
      </section>
    </main>
  </div>

  <div id="leaveModal" class="modal-backdrop hidden"><div class="modal"><header><h3 id="modalTitle">Request Leave</h3><button id="closeLeaveModal" class="btn btn--ghost">Close</button></header><div class="content"><form id="leaveForm" class="form-grid"><input id="leaveId" type="hidden"><div><label>Employee</label><select id="leaveEmployeeId"></select></div><div><label>Start Date</label><input id="leaveStart" type="date"></div><div><label>End Date</label><input id="leaveEnd" type="date"></div><div class="span-2"><label>Reason</label><textarea id="leaveReason"></textarea></div></form></div><footer><button id="saveLeaveBtn" class="btn btn--primary">Save</button></footer></div></div>

  <script src="app.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script src="leaves.js"></script>
  <script>
    (async function () { const ok = await Auth.requireAuth(); if (!ok) return; document.getElementById('logoutBtn').addEventListener('click', async ()=>{ await Auth.logout(); window.location.href='index.html'; }); await LeavesUI.init(); })();
  </script>
</body>
</html>
