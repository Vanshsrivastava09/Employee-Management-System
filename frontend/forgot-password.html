<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMS - Forgot Password</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-layout">
        <div class="auth-visual">
          <div class="landing-welcome">
            <div class="auth-graphic"></div>
            <h2>Reset Password</h2>
            <p class="welcome-copy">Enter your email address and we'll send you a link to reset your password.</p>
          </div>
        </div>

        <div class="auth-panel">
          <h1>Forgot Password</h1>
          <p>Enter your email to receive a password reset link.</p>

          <form id="forgotPasswordForm" class="form" novalidate>
            <div>
              <label for="email">Email Address</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="your@email.com" required />
              <span class="field-error" id="emailError"></span>
            </div>

            <div id="forgotPasswordError" class="field-error"></div>
            <div id="forgotPasswordSuccess" class="field-success"></div>

            <button class="btn btn--primary" type="submit" id="forgotPasswordBtn">
              <span class="btn-text">Send Reset Link</span>
              <span class="spinner hidden" aria-hidden="true"></span>
            </button>

            <div class="auth-switch">
              <a href="index.html">Back to login</a>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    document.getElementById("forgotPasswordForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const button = document.getElementById("forgotPasswordBtn");
      const spinner = button.querySelector(".spinner");
      const buttonText = button.querySelector(".btn-text");
      const errorBox = document.getElementById("forgotPasswordError");
      const successBox = document.getElementById("forgotPasswordSuccess");

      document.getElementById("emailError").textContent = email ? "" : "Email is required.";
      errorBox.textContent = "";
      successBox.textContent = "";
      if (!email) return;

      try {
        button.disabled = true;
        spinner.classList.remove("hidden");
        buttonText.textContent = "Sending...";

        const response = await fetch(App.API_BASE + "/api/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email })
        });

        const data = await response.json();
        
        if (response.ok) {
          successBox.textContent = data.message || "If an account with this email exists, a reset link has been sent.";
          document.getElementById("email").value = "";
        } else {
          errorBox.textContent = data.message || "Failed to send reset link.";
        }
      } catch (error) {
        errorBox.textContent = error.message || "Failed to send reset link.";
      } finally {
        button.disabled = false;
        spinner.classList.add("hidden");
        buttonText.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
