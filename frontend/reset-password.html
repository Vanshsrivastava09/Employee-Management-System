<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMS - Reset Password</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-layout">
        <div class="auth-visual">
          <div class="landing-welcome">
            <div class="auth-graphic"></div>
            <h2>Set New Password</h2>
            <p class="welcome-copy">Enter your new password below. Make sure it's at least 8 characters long.</p>
          </div>
        </div>

        <div class="auth-panel">
          <h1>Reset Password</h1>
          <p>Enter your new password to complete the reset.</p>

          <form id="resetPasswordForm" class="form" novalidate>
            <div>
              <label for="newPassword">New Password</label>
              <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="Enter new password" required minlength="8" />
              <span class="field-error" id="newPasswordError"></span>
            </div>

            <div>
              <label for="confirmPassword">Confirm Password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm new password" required minlength="8" />
              <span class="field-error" id="confirmPasswordError"></span>
            </div>

            <div id="resetPasswordError" class="field-error"></div>
            <div id="resetPasswordSuccess" class="field-success"></div>

            <button class="btn btn--primary" type="submit" id="resetPasswordBtn">
              <span class="btn-text">Reset Password</span>
              <span class="spinner hidden" aria-hidden="true"></span>
            </button>

            <div class="auth-switch">
              <a href="index.html">Back to login</a>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    // Get token and type from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const type = urlParams.get('type') || 'admin';

    if (!token) {
      document.getElementById("resetPasswordError").textContent = "Invalid or missing reset token.";
      document.getElementById("resetPasswordBtn").disabled = true;
    }

    document.getElementById("resetPasswordForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const button = document.getElementById("resetPasswordBtn");
      const spinner = button.querySelector(".spinner");
      const buttonText = button.querySelector(".btn-text");
      const errorBox = document.getElementById("resetPasswordError");
      const successBox = document.getElementById("resetPasswordSuccess");

      document.getElementById("newPasswordError").textContent = newPassword ? "" : "Password is required.";
      document.getElementById("confirmPasswordError").textContent = confirmPassword ? "" : "Please confirm your password.";
      errorBox.textContent = "";
      successBox.textContent = "";

      if (!newPassword || !confirmPassword) return;

      if (newPassword !== confirmPassword) {
        document.getElementById("confirmPasswordError").textContent = "Passwords do not match.";
        return;
      }

      if (newPassword.length < 8) {
        document.getElementById("newPasswordError").textContent = "Password must be at least 8 characters.";
        return;
      }

      try {
        button.disabled = true;
        spinner.classList.remove("hidden");
        buttonText.textContent = "Resetting...";

        const response = await fetch(App.API_BASE + "/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ 
            token,
            newPassword,
            type
          })
        });

        const data = await response.json();
        
        if (response.ok) {
          successBox.textContent = data.message || "Password has been reset successfully.";
          setTimeout(() => {
            window.location.href = "index.html";
          }, 2000);
        } else {
          errorBox.textContent = data.message || "Failed to reset password.";
        }
      } catch (error) {
        errorBox.textContent = error.message || "Failed to reset password.";
      } finally {
        button.disabled = false;
        spinner.classList.add("hidden");
        buttonText.textContent = "Reset Password";
      }
    });
  </script>
</body>
</html>
