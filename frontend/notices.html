<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMS HR Notices</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-mini"><div class="mark"></div><div><div class="brand-text">EMS HR</div><div class="brand-sub">Admin Panel</div></div></div>
      <nav class="nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="employees.html">Employees</a>
        <a href="departments.html">Departments</a>
        <a href="salaries.html">Salaries</a>
        <a class="active" href="notices.html">Issue Notices</a>
        <a href="leaves.html">Leaves</a>
        <a href="attendances.html">Attendances</a>
        <a href="requests.html">Requests</a>
      </nav>
      <div class="sidebar-footer"><div class="profile-section"><div class="profile-avatar"></div><div><div class="profile-name">HR Admin</div><div class="profile-sub">Session active</div></div></div><button id="logoutBtn" class="btn btn--ghost" type="button">Logout</button></div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button id="mobileMenuBtn" class="icon-btn mobile-menu" type="button">M</button>
          <div class="header-title"><h2>Notices</h2><p>Create and manage HR notices and announcements.</p></div>
        </div>
        <button id="createNoticeBtn" class="btn btn--primary" type="button">Add Notice</button>
      </div>

      <section class="table-wrap">
        <div class="table-tools"><div class="left"><input id="searchNotice" placeholder="Search notices"></div><div class="right"><span class="pill">Announcements</span></div></div>
        <div class="table-scroll"><table><thead><tr><th>Title</th><th>Message</th><th>Priority</th><th style="text-align:right;">Actions</th></tr></thead><tbody id="noticesTableBody"><tr><td colspan="4">Loading...</td></tr></tbody></table></div>
      </section>
    </main>
  </div>

  <div id="noticeModal" class="modal-backdrop hidden"><div class="modal"><header><h3 id="modalTitle">Add Notice</h3><button id="closeNoticeModal" class="btn btn--ghost">Close</button></header><div class="content"><form id="noticeForm" class="form-grid"><input id="noticeId" type="hidden"><div><label>Title</label><input id="noticeTitle" required></div><div class="span-2"><label>Message</label><textarea id="noticeMessage"></textarea></div><div class="span-2"><label>Priority</label><select id="noticePriority"><option>LOW</option><option>MEDIUM</option><option>HIGH</option></select></div></form></div><footer><button id="saveNoticeBtn" class="btn btn--primary">Save</button></footer></div></div>

  <script src="app.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script src="notices.js"></script>
  <script>
    (async function () { const ok = await Auth.requireAuth(); if (!ok) return; document.getElementById('logoutBtn').addEventListener('click', async ()=>{ await Auth.logout(); window.location.href='index.html'; }); await NoticesUI.init(); })();
  </script>
</body>
</html>
