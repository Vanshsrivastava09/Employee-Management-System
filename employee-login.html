<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMS - Employee Login</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-layout">
        <div class="auth-visual"><div class="auth-graphic"></div></div>
        <div class="auth-panel">
          <h1>Employee Login</h1>
          <p>Employee self-service screen for portfolio completeness.</p>
          <form id="employeeLoginForm" class="form" novalidate>
            <div><label>Email address</label><input type="email" required placeholder="employee@example.com"></div>
            <div><label>Password</label><input type="password" required placeholder="Password"></div>
            <button class="btn btn--primary" type="submit">Sign in</button>
            <div class="auth-switch">
              <span>Are you HR?</span>
              <a href="index.html" style="color:var(--primary);font-weight:900;">HR login</a>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
  <script>
    document.getElementById("employeeLoginForm").addEventListener("submit", function (event) {
      event.preventDefault();
      App.showToast("Employee login UI is ready for future role-based auth.", "success");
    });
  </script>
</body>
</html>
